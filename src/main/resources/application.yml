# Committed, secret-free configuration. Every deployment-specific value comes
# from an environment variable. There is intentionally NO default for
# JWT_SECRET or DB_PASSWORD: without them the application refuses to start.
#
# Local development: run with the `dev` profile (see application-dev.yml and
# README.md). A gitignored src/main/resources/application.properties can hold
# personal overrides; Spring loads it on top of this file.

spring:
  application:
    name: learning-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${DB_USERNAME:learning_platform}
    password: ${DB_PASSWORD:}

  jpa:
    # The schema is owned by Flyway (src/main/resources/db/migration);
    # Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Never allow `flyway clean` to wipe a database.
    clean-disabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    # Comma-separated exact browser origins of the frontend, e.g.
    # https://app.example.com. Empty = no cross-origin access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  security:
    jwt:
      # >= 32 random bytes, e.g. `openssl rand -base64 48`. Required.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:learning-platform}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    auth:
      refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:1d}
      remember-me-refresh-token-ttl: ${AUTH_REMEMBER_ME_REFRESH_TOKEN_TTL:30d}
      max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:5}
      login-lock-duration: ${AUTH_LOGIN_LOCK_DURATION:15m}
      cookie:
        name: ${AUTH_COOKIE_NAME:lp_refresh_token}
        path: ${AUTH_COOKIE_PATH:/api/auth}
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
        domain: ${AUTH_COOKIE_DOMAIN:}
